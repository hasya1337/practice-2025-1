<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280">
  <rect width="300" height="280" fill="#f5f3ff" rx="16"/>
  <text x="150" y="25" text-anchor="middle" fill="#5850e8" font-size="12" font-weight="bold">Архитектура САЛЮТ</text>

  <!-- Frontend -->
  <rect x="30" y="40" width="110" height="35" fill="#5850e8" rx="8"/>
  <text x="85" y="62" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Next.js 16</text>

  <rect x="160" y="40" width="110" height="35" fill="#8b5cf6" rx="8"/>
  <text x="215" y="62" text-anchor="middle" fill="white" font-size="10" font-weight="bold">React 18</text>

  <!-- Services -->
  <rect x="30" y="95" width="110" height="35" fill="#f59e0b" rx="8"/>
  <text x="85" y="117" text-anchor="middle" fill="#332a00" font-size="10" font-weight="bold">PDF.js</text>

  <rect x="160" y="95" width="110" height="35" fill="#10b981" rx="8"/>
  <text x="215" y="117" text-anchor="middle" fill="white" font-size="10" font-weight="bold">File API</text>

  <!-- API -->
  <rect x="95" y="150" width="110" height="35" fill="#5850e8" rx="8"/>
  <text x="150" y="172" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Claude API</text>

  <!-- Storage -->
  <rect x="95" y="205" width="110" height="35" fill="#ec489a" rx="8"/>
  <text x="150" y="227" text-anchor="middle" fill="white" font-size="10" font-weight="bold">localStorage</text>

  <!-- Arrows -->
  <line x1="150" y1="185" x2="150" y2="205" stroke="#5850e8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="75" x2="150" y2="95" stroke="#5850e8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="85" y1="75" x2="85" y2="95" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="215" y1="75" x2="215" y2="95" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5850e8"/>
    </marker>
  </defs>
</svg>